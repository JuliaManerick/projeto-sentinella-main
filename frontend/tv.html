<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mídia Indoor - TV</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    body {
      background-color: #f0fdfa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .tv-container {
      display: flex;
      width: 95vw;
      height: 90vh;
      gap: 20px;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      width: 35%;
      gap: 20px;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      width: 65%;
      gap: 20px;
    }

    .box {
      background-color: #ffffff;
      border: 2px solid #ccfbf1;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 25px rgba(15, 118, 110, 0.08);
    }

    .box-title {
      color: #0f766e;
      font-size: 2vw;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      border-bottom: 2px solid #ccfbf1;
      padding-bottom: 6px;
      width: 100%;
    }

    /* Painel esquerdo - local (guichê ou consultório) */
    .local-box { 
      flex: 1; 
      background: linear-gradient(135deg, #ffffff 0%, #f0fdfa 100%);
    }

    .local-number {
      color: #0d9488;
      font-size: 9.5vw;
      font-weight: 800;
      line-height: 1;
      margin-top: 5px;
    }

    .local-type {
      color: #52525b;
      font-size: 1.8vw;
      font-weight: bold;
      margin-top: 6px;
    }

    /* Histórico */
    .history-box {
      flex: 1;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .history-box .box-title { 
      font-size: 1.6vw; 
      text-align: center;
    }

    #history-list {
      list-style: none;
      width: 100%;
      color: #134e4a;
      font-size: 1.4vw;
      font-weight: 600;
      text-align: left;
    }

    #history-list li {
      margin-bottom: 10px;
      border-bottom: 1px solid #f0fdfa;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
    }

    #history-list li::before {
      content: "•";
      color: #0d9488;
      font-size: 1.8vw;
      margin-right: 10px;
    }

    /* Painel direito - nome do paciente */
    .patient-box { 
      flex: 3; 
      background: linear-gradient(135deg, #ffffff 0%, #f0fdfa 100%);
    }

    .patient-name {
      color: #0f766e;
      font-size: 6vw;
      font-weight: 800;
      line-height: 1.2;
      word-break: break-word;
      margin-top: 10px;
    }

    /* Logo */
    .logo-box { 
      flex: 1; 
      background-color: #0d9488;
      border-color: #0f766e;
    }

    .logo-text {
      color: #ffffff;
      font-size: 3.2vw;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Animação de flash quando chama */
    @keyframes flash {
      0%, 100% { 
        background-color: #ffffff; 
        transform: scale(1);
      }
      50% { 
        background-color: #ccfbf1; 
        transform: scale(1.02);
      }
    }

    .flash { 
      animation: flash 0.6s ease-in-out 3; 
    }
  </style>
</head>
<body>

<!-- Estrutura da tela da TV criada para exibir o local e o nome do paciente chamado -->
<div class="tv-container">
  <div class="left-panel">
    <div class="box local-box">
      <div class="box-title" id="local-tipo">GUICHÊ</div>
      <div class="local-number" id="local-numero">--</div>
    </div>
    <div class="box history-box">
      <div class="box-title">ÚLTIMAS CHAMADAS</div>
      <ul id="history-list"></ul>
    </div>
  </div>
  <div class="right-panel">
    <div class="box patient-box">
      <div class="box-title">PACIENTE</div>
      <div class="patient-name" id="patient-name">AGUARDANDO...</div>
    </div>
    <div class="box logo-box">
      <div class="logo-text">🏥 Sistema Hospitalar</div>
    </div>
  </div>
</div>

<script>
let ultimoId = null;

// Função criada para buscar a chamada atual e o histórico da TV em tempo real.
function atualizar() {
  fetch("/tv/chamada")
    .then(r => r.json())
    .then(data => {
      const chamada = data.chamada;
      const historico = data.historico || [];

      if (chamada) {
        document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHÊ";
        document.getElementById("local-numero").innerText = chamada.localNumero || "--";
        document.getElementById("patient-name").innerText = chamada.paciente || "AGUARDANDO...";

        // Flash visual quando há chamada nova
        if (chamada.id !== ultimoId) {
          ultimoId = chamada.id;
          const patientBox = document.querySelector(".patient-box");
          patientBox.classList.remove("flash");
          void patientBox.offsetWidth; // reflow
          patientBox.classList.add("flash");
        }
      }

      // Histórico
      const list = document.getElementById("history-list");
      list.innerHTML = "";
      historico.slice(0, 4).forEach(h => {
        const li = document.createElement("li");
        const tipo = h.localTipo ? h.localTipo.substring(0,4) : "GUIC";
        li.innerText = `${tipo}. ${h.localNumero} - ${h.paciente}`;
        list.appendChild(li);
      });
    })
    .catch(err => console.log("Erro ao buscar chamada:", err));
}

// Polling a cada 2 segundos
atualizar();
setInterval(atualizar, 2000);
</script>

</body>
</html>
